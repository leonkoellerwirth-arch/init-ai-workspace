# yaml-language-server: $schema=https://aka.ms/configuration-dsc-schema/0.2
# kickoff – Windows-Pakete für `winget configure`. Toolchain-Versionen stehen in mise.toml.
# WSL2 kommt als Paket von hier; Aktivierung und Neustart übernimmt steps/50-docker.ps1.
properties:
  configurationVersion: 0.2.0
  resources:
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: git
      directives:
        description: Git (inkl. Git Credential Manager)
      settings:
        id: Git.Git
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: gh
      directives:
        description: GitHub CLI
      settings:
        id: GitHub.cli
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: mise
      directives:
        description: mise (Toolchain-Manager)
      settings:
        id: jdx.mise
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: vscode
      directives:
        description: Visual Studio Code
      settings:
        id: Microsoft.VisualStudioCode
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: wsl
      directives:
        description: Windows-Subsystem für Linux (WSL2)
      settings:
        id: Microsoft.WSL
        source: winget
    - resource: Microsoft.WinGet.DSC/WinGetPackage
      id: docker
      dependsOn:
        - wsl
      directives:
        description: Docker Desktop (WSL2-Backend)
      settings:
        id: Docker.DockerDesktop
        source: winget
