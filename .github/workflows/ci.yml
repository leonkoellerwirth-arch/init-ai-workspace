name: ci

on:
  push:
  pull_request:

env:
  KICKOFF_GIT_NAME: kickoff CI
  KICKOFF_GIT_EMAIL: ci@example.invalid

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck + PSScriptAnalyzer
        run: tests/lint.sh

  macos-dry-run:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: Dry-Run
        run: ./bootstrap.sh --dry-run --non-interactive
      - name: Smoke-Tests
        run: tests/smoke/smoke.sh
      # Echte Installationen in CI nur für git, gh, mise, node (Spec §8) – ohne Casks und npm-Pakete.
      - name: Echte Installation (git, gh, mise, node)
        env:
          HOMEBREW_BUNDLE_CASK_SKIP: visual-studio-code docker-desktop
          KICKOFF_NPM_GLOBALS: ""
        run: ./bootstrap.sh --non-interactive --only 10 --only 20
      - name: Zweiter Lauf ändert nichts
        env:
          HOMEBREW_BUNDLE_CASK_SKIP: visual-studio-code docker-desktop
          KICKOFF_NPM_GLOBALS: ""
        run: |
          ./bootstrap.sh --non-interactive --only 10 --only 20 | tee second-run.log
          if grep -q '➜' second-run.log; then echo "Zweiter Lauf hat Änderungen geplant"; exit 1; fi

  windows-dry-run:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Dry-Run (Windows PowerShell 5.1)
        shell: powershell
        run: .\bootstrap.ps1 -DryRun -NonInteractive
      - name: Smoke-Tests (Windows PowerShell 5.1)
        shell: powershell
        run: .\tests\smoke\smoke.ps1

  # Echter Teillauf auf Windows (BIBLE: Windows-Testweg A). Schritt 10 (winget configure inkl.
  # VS Code/Docker Desktop) und 50 (WSL2-Neustart) bleiben draußen; mise kommt daher von der Action.
  windows-real-run:
    runs-on: windows-latest
    env:
      # Ein leerer Wert löscht unter Windows die Variable – ein Leerzeichen heißt hier "keine npm-Pakete".
      KICKOFF_NPM_GLOBALS: " "
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v5
        with:
          install: false
      - name: Echter Lauf (Schritte 20, 30, 60; Windows PowerShell 5.1)
        shell: powershell
        run: .\bootstrap.ps1 -NonInteractive -Only 20,30,60
      - name: Zweiter Lauf ändert nichts
        shell: powershell
        run: |
          .\bootstrap.ps1 -NonInteractive -Only 20,30,60
          # Konsolenausgabe geht an der Pipeline vorbei – geprüft wird das Log des Laufs (DO = geplante Änderung).
          $log = Get-ChildItem -Path (Join-Path $HOME '.kickoff\logs') -Filter '*.log' | Sort-Object LastWriteTime | Select-Object -Last 1
          $changes = Select-String -Path $log.FullName -Pattern '] DO ' -SimpleMatch
          if ($changes) { $changes | ForEach-Object { $_.Line }; throw 'Zweiter Lauf hat Aenderungen geplant' }
      - name: Keine npm-Pakete installiert
        shell: powershell
        run: |
          npm ls -g --depth=0 @anthropic-ai/claude-code
          if ($LASTEXITCODE -eq 0) { throw 'claude-code wurde trotz KICKOFF_NPM_GLOBALS installiert' }
          exit 0
